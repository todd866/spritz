name: SpritzMobile
options:
  bundleIdPrefix: io.github.todd866
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  SpritzMobile:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - SpritzMobile.entitlements
      - path: Shared
    dependencies:
      - target: SpritzKeyboard
      - framework: Frameworks/SpritzCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPRITZ_IOS_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SpritzMobile.entitlements
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
  SpritzKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - Info.plist
          - SpritzKeyboard.entitlements
      - path: Shared
    dependencies:
      - framework: Frameworks/SpritzCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPRITZ_IOS_KEYBOARD_BUNDLE_ID)
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/SpritzKeyboard.entitlements
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  SpritzMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SpritzMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPRITZ_IOS_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
  SpritzMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SpritzMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPRITZ_IOS_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SpritzMobile:
    build:
      targets:
        SpritzMobile: [run, test, profile, analyze, archive]
        SpritzKeyboard: [run, test, profile, analyze, archive]
        SpritzMobileTests: [test]
        SpritzMobileUITests: [test]
    test:
      config: Debug
      targets:
        - SpritzMobileTests
        - SpritzMobileUITests
    archive:
      config: Release
  SpritzKeyboard:
    build:
      targets:
        SpritzKeyboard: all
